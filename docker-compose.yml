version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agnietra-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agnietra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agnietra_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agnietra_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agnietra} -d ${POSTGRES_DB:-agnietra_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agnietra-backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-agnietra}:${POSTGRES_PASSWORD:-agnietra_dev}@db:5432/${POSTGRES_DB:-agnietra_db}"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agnietra-frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
